<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertisseur de devises</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    .card { background: #fff; width: 100%; max-width: 420px; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    h1 { font-size: 1.3rem; text-align: center; margin: 0 0 12px; color: #0f172a; }
    h2 { font-size: 1.05rem; margin: 0 0 8px; color: #0f172a; display: flex; justify-content: space-between; align-items: center; }
    label { display: block; font-size: .85rem; color: #475569; margin: 12px 0 4px; }
    input, select { width: 100%; padding: 10px 12px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; }
    .row { display: flex; gap: 8px; align-items: flex-end; }
    .row > div { flex: 1; min-width: 0; }
    #swap { border: none; background: #e2e8f0; border-radius: 10px; padding: 10px 12px; cursor: pointer; font-size: 1.1rem; }
    .result { margin-top: 20px; padding: 16px; background: #eff6ff; border-radius: 12px; text-align: center; }
    .result strong { font-size: 1.6rem; color: #1d4ed8; display: block; margin-top: 4px; }
    .rate, .updated { margin-top: 8px; font-size: .8rem; color: #64748b; text-align: center; }
    .badge { background: linear-gradient(90deg, #facc15, #f59e0b); color: #1e293b; font-size: .7rem; font-weight: 800; padding: 4px 10px; border-radius: 999px; }
    .hidden { display: none !important; }
    .lock-text { font-size: .9rem; color: #475569; margin: 0 0 4px; }
    .btn { display: block; width: 100%; padding: 11px; border: none; border-radius: 10px; font-size: .95rem; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; margin-top: 10px; }
    .btn-pay { background: #facc15; color: #1e293b; }
    .btn-main { background: #1d4ed8; color: #fff; }
    .btn-light { background: #e2e8f0; color: #1e293b; }
    .code-row { display: flex; gap: 8px; }
    .code-row input { flex: 1; min-width: 0; }
    .code-row .btn { width: auto; margin-top: 0; padding: 0 16px; }
    .msg { font-size: .85rem; margin-top: 8px; text-align: center; min-height: 1.2em; }
    .ok { color: #16a34a; }
    .ko { color: #dc2626; }
    .quick { display: flex; gap: 6px; margin: 8px 0; }
    .quick button { flex: 1; padding: 8px; border: none; border-radius: 8px; background: #e2e8f0; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    td { padding: 7px 4px; border-bottom: 1px solid #e2e8f0; }
    td:last-child { text-align: right; font-weight: 600; }
    ul { margin: 0; padding-left: 18px; font-size: .9rem; color: #334155; }
  </style>
</head>
<body>

  <!-- Convertisseur (gratuit) -->
  <div class="card">
    <h1>💱 Convertisseur de devises</h1>

    <label for="amount">Montant</label>
    <input type="number" id="amount" value="1" min="0" step="any">

    <div class="row">
      <div>
        <label for="from">De</label>
        <select id="from"></select>
      </div>
      <button id="swap" title="Inverser">⇄</button>
      <div>
        <label for="to">Vers</label>
        <select id="to"></select>
      </div>
    </div>

    <div class="result" id="result">Chargement des taux...</div>
    <div class="rate" id="rate"></div>
    <div class="updated" id="updated"></div>
  </div>

  <!-- Premium -->
  <div class="card">
    <!-- Verrouillé : paiement + code -->
    <div id="lockedBox">
      <h2>⭐ Premium <span class="badge">1 DH</span></h2>
      <p class="lock-text">Quantités rapides, devises populaires et historique des conversions.</p>
      <a class="btn btn-pay" id="payBtn" target="_blank" rel="noopener">💳 Payer par carte bancaire</a>

      <label for="code">Code d'activation (reçu après paiement)</label>
      <div class="code-row">
        <input id="code" placeholder="PRM-XXXX-XXXX" autocomplete="off">
        <button class="btn btn-main" id="activate">Activer</button>
      </div>
      <div class="msg" id="codeMsg"></div>
    </div>

    <!-- Déverrouillé -->
    <div id="premiumBox" class="hidden">
      <h2>⭐ Premium <span class="badge">ACTIF ✅</span></h2>

      <div class="quick">
        <button data-amt="1">1</button>
        <button data-amt="10">10</button>
        <button data-amt="100">100</button>
        <button data-amt="1000">1000</button>
      </div>

      <label>Devises populaires</label>
      <table><tbody id="table"></tbody></table>

      <button class="btn btn-light" id="save">➕ Garder cette conversion</button>

      <label>Historique</label>
      <ul id="history"><li>Pas encore de conversions gardées</li></ul>
    </div>
  </div>

<script>
  const API_URL = "https://open.er-api.com/v6/latest/USD";
  const PAYMENT_URL = "https://VOTRE-LIEN-DE-PAIEMENT"; // ← ton lien Stripe / CMI / PayPal
  const VALID_HASHES = [
    // "hash_du_code_1",  ← ajoute les hash ici (voir étape 2)
  ];
  const STORAGE_KEY = "premium_code_hash";
  const POPULAR = ["MAD", "EUR", "USD", "GBP", "SAR", "AED", "TRY", "CAD", "CHF", "CNY", "JPY", "DZD"];

  const $ = id => document.getElementById(id);
  const names = new Intl.DisplayNames(['fr'], { type: 'currency' });
  const fmt = n => n.toLocaleString('fr-FR', { maximumSignificantDigits: 6 });
  const rate = (from, to) => rates[to] / rates[from];
  const amount = () => parseFloat($('amount').value) || 0;

  let rates = {};
  let history = [];
  let unlocked = false;
  try { unlocked = VALID_HASHES.includes(localStorage.getItem(STORAGE_KEY)); } catch {}

  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text.trim().toUpperCase()));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // ---------- Convertisseur (gratuit) ----------
  async function loadRates() {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      if (data.result !== "success") throw new Error();
      rates = data.rates;

      const options = Object.keys(rates).sort().map(code => {
        let name = "";
        try { name = " - " + names.of(code); } catch {}
        return `<option value="${code}">${code}${name}</option>`;
      }).join("");

      $('from').innerHTML = options;
      $('to').innerHTML = options;
      $('from').value = "USD";
      $('to').value = "MAD";
      $('updated').textContent = "Dernière mise à jour : " + data.time_last_update_utc;
      convert();
    } catch {
      $('result').innerHTML = '<span class="ko">Erreur de connexion. Vérifie internet.</span>';
    }
  }

  function convert() {
    if (!Object.keys(rates).length) return;
    const from = $('from').value, to = $('to').value, amt = amount();
    $('result').innerHTML = `${fmt(amt)} ${from} = <strong>${fmt(amt * rate(from, to))} ${to}</strong>`;
    $('rate').textContent = `1 ${from} = ${fmt(rate(from, to))} ${to}`;
    if (unlocked) updatePremium();
  }

  // ---------- Premium ----------
  function refreshPremium() {
    $('lockedBox').classList.toggle('hidden', unlocked);
    $('premiumBox').classList.toggle('hidden', !unlocked);
    if (unlocked) updatePremium();
  }

  function updatePremium() {
    if (!Object.keys(rates).length) return;
    const from = $('from').value, amt = amount();
    $('table').innerHTML = POPULAR
      .filter(c => rates[c] && c !== from)
      .map(c => `<tr><td>${c}</td><td>${fmt(amt * rate(from, c))}</td></tr>`)
      .join("");
  }

  function saveConversion() {
    if (!Object.keys(rates).length) return;
    const from = $('from').value, to = $('to').value, amt = amount();
    history.unshift(`${fmt(amt)} ${from} = ${fmt(amt * rate(from, to))} ${to}`);
    history = history.slice(0, 5);
    $('history').innerHTML = history.map(h => `<li>${h}</li>`).join("");
  }

  async function activate() {
    const msg = $('codeMsg');
    try {
      const hash = await sha256($('code').value);
      if (VALID_HASHES.includes(hash)) {
        unlocked = true;
        try { localStorage.setItem(STORAGE_KEY, hash); } catch {}
        msg.className = "msg ok";
        msg.textContent = "Premium activé ✅";
        refreshPremium();
      } else {
        msg.className = "msg ko";
        msg.textContent = "Code invalide ❌";
      }
    } catch {
      msg.className = "msg ko";
      msg.textContent = "Erreur : essaie avec un navigateur plus récent.";
    }
  }

  // ---------- Événements ----------
  $('amount').addEventListener('input', convert);
  $('from').addEventListener('change', convert);
  $('to').addEventListener('change', convert);
  $('swap').addEventListener('click', () => {
    const tmp = $('from').value;
    $('from').value = $('to').value;
    $('to').value = tmp;
    convert();
  });
  document.querySelectorAll('.quick button').forEach(btn => {
    btn.addEventListener('click', () => {
      $('amount').value = btn.dataset.amt;
      convert();
    });
  });
  $('save').addEventListener('click', saveConversion);
  $('activate').addEventListener('click', activate);
  $('payBtn').href = PAYMENT_URL;

  refreshPremium();
  loadRates();
</script>
</body>
</html>
